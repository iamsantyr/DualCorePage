<section class="expertise-section">
  <div class="expertise-container">
    <div class="section-header">
      <h2 class="section-title">Our Expertise</h2>
      <p class="section-subtitle">
        Cutting-edge technologies for agentic workflows and advanced machine learning
      </p>
    </div>
    <div class="expertise-grid">
      @for (area of expertiseAreas; track area.title) {
        <div class="expertise-card">
          <div class="expertise-header">
            <div class="expertise-icon">{{ area.icon }}</div>
            <div class="expertise-info">
              <h3>{{ area.title }}</h3>
            </div>
          </div>
          <p class="expertise-description">{{ area.description }}</p>
          <div class="skill-tags">
            @for (skill of area.skills; track skill) {
              <span class="skill-tag">{{ skill }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
